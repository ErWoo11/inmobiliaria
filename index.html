<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InmoTravel | Lujo y Comodidad</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container nav-content">
            <a href="#" class="logo"><i class="fas fa-building-user"></i> InmoTravel</a>
            <div class="desktop-only">
                <a href="admin.html" class="btn btn-primary" style="font-size:0.8rem; padding: 8px 16px;">Acceso Agencia</a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Encuentra tu espacio<br>en el mundo</h1>
            <p>Vacaciones exclusivas o tu nuevo hogar.</p>
            <div style="display:flex; gap:15px; justify-content:center;">
                <button class="btn btn-accent" onclick="window.location.href='#properties'">Ver Propiedades</button>
            </div>
        </div>
    </section>

    <main class="container" id="properties">
        <div style="display:flex; justify-content:center; gap:15px; margin-bottom:30px; flex-wrap:wrap;">
            <button class="btn btn-primary filter-btn active" onclick="app.filter('all')">Todos</button>
            <button class="btn btn-primary filter-btn" onclick="app.filter('rent')">Alquiler Vacacional</button>
            <button class="btn btn-primary filter-btn" onclick="app.filter('sale')">Venta Inmobiliaria</button>
        </div>

        <div class="properties-grid" id="properties-grid">
            <!-- Se llena con JS -->
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i> Inicio</a>
        <a href="#" class="nav-item"><i class="fas fa-heart"></i> Favoritos</a>
        <a href="#" class="nav-item"><i class="fas fa-user"></i> Perfil</a>
    </nav>

    <!-- MODAL DE DETALLES -->
    <div id="property-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="app.closeModal()">
                <i class="fas fa-times"></i>
            </button>
            
            <div id="modal-image-container">
                <img id="modal-img" src="" alt="Detalle">
            </div>

            <div class="modal-body">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span id="modal-badge" class="badge"></span>
                    <span id="modal-price" style="font-size:1.5rem; font-weight:bold; color:var(--primary);"></span>
                </div>

                <h2 id="modal-title" style="margin-bottom:5px;"></h2>
                <p id="modal-location" style="color:var(--text-light); margin-bottom:20px; display:flex; align-items:center; gap:5px;">
                    <i class="fas fa-map-marker-alt"></i> <span></span>
                </p>

                <div style="display:flex; gap:20px; margin-bottom:20px; padding:15px; background:#f1f5f9; border-radius:10px;">
                    <div style="text-align:center; flex:1;">
                        <i class="fas fa-bed"></i><br>
                        <strong id="modal-beds"></strong> Hab.
                    </div>
                    <div style="text-align:center; flex:1;">
                        <i class="fas fa-bath"></i><br>
                        <strong id="modal-baths"></strong> Baños
                    </div>
                </div>

                <p id="modal-desc" style="line-height:1.6; color:#475569; margin-bottom:30px;"></p>

                <button class="btn btn-primary" style="width:100%" onclick="app.contactAgent()">
                    <i class="fas fa-envelope"></i> Contactar Agente
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONTACTO (NUEVO) -->
    <div id="contact-modal" class="modal-overlay">
        <div class="modal-content" style="height: auto; max-height: 85vh;">
            <button class="close-modal-btn" onclick="app.closeContactModal()">
                <i class="fas fa-times"></i>
            </button>
            <div style="padding: 30px;">
                <h2 style="margin-bottom: 10px; color: var(--primary);">Contactar Agente</h2>
                <p style="color: #666; margin-bottom: 20px;">Estás interesado en: <strong id="contact-prop-title"></strong></p>
                
                <form id="contact-form" onsubmit="app.sendContact(event)">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="contact-name" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="contact-email" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" id="contact-phone" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label>Mensaje</label>
                        <textarea id="contact-message" class="form-textarea" rows="3" placeholder="Hola, me interesa esta propiedad..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar Solicitud</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>

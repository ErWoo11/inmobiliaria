<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | InmoTravel</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container nav-content">
            <button class="hamburger-btn" onclick="adminApp.toggleMenu()">
                <i class="fas fa-bars"></i>
            </button>
            
            <a href="#" class="logo"><i class="fas fa-building-user"></i> Admin Panel</a>
            
            <div style="display:flex; gap:10px;">
                <button class="btn btn-outline" style="border:1px solid #ccc;" onclick="window.location.href='index.html'">
                    <i class="fas fa-globe"></i> Ver Web
                </button>
            </div>
        </div>
    </header>

    <div class="admin-layout" id="admin-panel">
        
        <!-- SIDEBAR -->
        <aside class="admin-sidebar">
            <nav>
                <a href="#" class="nav-link active" onclick="adminApp.switchView('dashboard', this)">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="#" class="nav-link" onclick="adminApp.switchView('inmuebles', this)">
                    <i class="fas fa-home"></i> Inmuebles
                </a>
                <a href="#" class="nav-link" onclick="adminApp.switchView('messages', this)">
                    <i class="fas fa-envelope"></i> Mensajes
                    <span id="msg-badge" style="background:var(--accent); color:white; padding:2px 6px; border-radius:10px; font-size:0.7rem; margin-left:auto; display:none;">0</span>
                </a>
                <!-- NUEVA PESTAÑA CLIENTES -->
                <a href="#" class="nav-link" onclick="adminApp.switchView('clients', this)">
                    <i class="fas fa-users"></i> Seguimiento Clientes
                </a>
            </nav>
        </aside>

        <div class="sidebar-overlay" onclick="adminApp.toggleMenu()"></div>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="admin-main">
            
            <!-- VISTA DASHBOARD -->
            <section id="view-dashboard" class="admin-view">
                <h2>Resumen General</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3 id="stat-props">0</h3>
                        <p>Inmuebles Totales</p>
                    </div>
                    <div class="stat-card" style="border-color: var(--accent);">
                        <h3 id="stat-msgs">0</h3>
                        <p>Mensajes</p>
                    </div>
                    <div class="stat-card" style="border-color: #3b82f6;">
                        <h3 id="stat-rentals">0</h3>
                        <p>En Alquiler</p>
                    </div>
                    <div class="stat-card" style="border-color: #ef4444;">
                        <h3 id="stat-sales">0</h3>
                        <p>En Venta</p>
                    </div>
                    <!-- AÑADE ESTO AQUÍ -->
                    <div class="stat-card" style="border-color: #10b981;">
                        <h3 id="stat-clients">0</h3>
                        <p>Clientes Seguimiento</p>
                    </div>
                </div>
                
                <div class="admin-form">
                    <h3><i class="fas fa-bolt"></i> Accesos Rápidos</h3>
                    <div style="margin-top:15px; display:flex; gap:10px;">
                        <button class="btn btn-primary" onclick="adminApp.openPropertyModal()">Añadir Inmueble</button>
                        <button class="btn btn-outline" onclick="adminApp.switchView('messages')">Ver Bandeja de Entrada</button>
                    </div>
                </div>
            </section>

            <!-- VISTA INMUEBLES -->
            <section id="view-inmuebles" class="admin-view" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2>Gestión de Inmuebles</h2>
                    <button class="btn btn-primary" onclick="adminApp.openPropertyModal()">
                        <i class="fas fa-plus"></i> Añadir Inmueble
                    </button>
                </div>

                <!-- BARRA DE FILTROS -->
                <div class="filter-bar">
                    <div class="filter-group">
                        <label>Nº Referencia</label>
                        <input type="text" id="filter-ref" class="filter-input" placeholder="REF-..." onkeyup="adminApp.applyFilters()">
                    </div>
                    <div class="filter-group">
                        <label>Estado</label>
                        <select id="filter-status" class="filter-input" onchange="adminApp.applyFilters()">
                            <option value="">Todos</option>
                            <option value="available">Disponible</option>
                            <option value="reserved">Reservado</option>
                            <option value="sold">Vendido</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Tipo</label>
                        <select id="filter-type" class="filter-input" onchange="adminApp.applyFilters()">
                            <option value="">Todos</option>
                            <option value="rent">Alquiler</option>
                            <option value="sale">Venta</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Categoría</label>
                        <select id="filter-category" class="filter-input" onchange="adminApp.applyFilters()">
                            <option value="">Todas</option>
                            <option value="apartamento">Apartamento</option>
                            <option value="villa">Villa</option>
                            <option value="piso">Piso</option>
                            <option value="parcela">Parcela</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Mes</label>
                        <input type="month" id="filter-date" class="filter-input" onchange="adminApp.applyFilters()">
                    </div>
                    <div class="filter-group">
                        <button class="btn-clear" onclick="adminApp.clearFilters()">Limpiar Filtros</button>
                    </div>
                </div>

                <!-- GRID DE INMUEBLES -->
                <div id="admin-list" class="properties-grid"></div>
            </section>

            <!-- MODAL DE FORMULARIO (OCULTO) -->
            <div id="property-admin-modal" class="modal-overlay">
                <div class="modal-content">
                    <button class="close-modal-btn" onclick="adminApp.closePropertyModal()"><i class="fas fa-times"></i></button>
                    <div class="admin-modal-form">
                        <h3 id="form-title-modal">Nuevo Inmueble</h3>
                        <input type="hidden" id="edit-id">
                        
                        <!-- Nº Referencia (Solo lectura) -->
                        <div class="form-group">
                            <label>Nº Referencia (Generado automáticamente)</label>
                            <input type="text" id="ref-number" class="form-input" readonly style="background:#f1f5f9; color:#64748b;">
                        </div>

                        <form id="property-form-modal">
                            <!-- El resto del formulario igual que antes, pero con IDs únicos si es necesario (los mantendremos iguales por simplicidad si el JS los llama bien, pero para evitar conflictos usaremos los mismos IDs ya que el modal está oculto) -->
                            <div class="form-grid">
                                <div class="form-group full-width">
                                    <label>Título</label>
                                    <input type="text" id="title" required>
                                </div>
                                <div class="form-group">
                                    <label>Precio (€)</label>
                                    <input type="number" id="price" required>
                                </div>
                                <div class="form-group">
                                    <label>Periodo</label>
                                    <select id="period">
                                        <option value="">Venta</option>
                                        <option value="noche">Noche</option>
                                        <option value="mes">Mes</option>
                                    </select>
                                </div>
                                <div class="form-group full-width">
                                    <label>Imágenes (URLs separadas por salto de línea)</label>
                                    <textarea id="img" rows="3" required></textarea>
                                </div>
                                <div class="form-group">
                                    <label>Tipo</label>
                                    <select id="type" required>
                                        <option value="rent">Alquiler</option>
                                        <option value="sale">Venta</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Estado</label>
                                    <select id="status">
                                        <option value="available">Disponible</option>
                                        <option value="reserved">Reservado</option>
                                        <option value="sold">Vendido</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Categoría</label>
                                    <select id="category">
                                        <option value="apartamento">Apartamento</option>
                                        <option value="villa">Villa</option>
                                        <option value="piso">Piso</option>
                                        <option value="parcela">Parcela</option>
                                    </select>
                                </div>
                                <div class="form-group full-width">
                                    <label>Ubicación</label>
                                    <input type="text" id="location" required>
                                </div>
                                <div class="form-group">
                                    <label>Habitaciones</label>
                                    <input type="number" id="beds" value="2">
                                </div>
                                <div class="form-group">
                                    <label>Baños</label>
                                    <input type="number" id="baths" value="1">
                                </div>
                                <div class="form-group full-width">
                                    <label>Descripción</label>
                                    <textarea id="desc" rows="3"></textarea>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary" id="btn-save-modal" style="width:100%">Guardar Inmueble</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- VISTA MENSAJES -->
            <section id="view-messages" class="admin-view" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2>Bandeja de Entrada</h2>
                    <button class="btn btn-danger btn-xs" onclick="adminApp.deleteAllMessages()">
                        <i class="fas fa-trash-alt"></i> Eliminar Todos
                    </button>
                </div>
                <div id="messages-container"></div>
            </section>

            <!-- VISTA CLIENTES (NUEVA) -->
            <section id="view-clients" class="admin-view" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2>Seguimiento de Clientes</h2>
                    <button class="btn btn-primary btn-xs" onclick="document.getElementById('add-client-form').style.display='block'">
                        <i class="fas fa-plus"></i> Nuevo Cliente Manual
                    </button>
                </div>

                <!-- Formulario añadir manual -->
                <div id="add-client-form" class="admin-form" style="display:none; margin-bottom:20px;">
                    <h4>Añadir Cliente Manual</h4>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                        <input type="text" id="new-client-name" placeholder="Nombre" class="form-input">
                        <input type="text" id="new-client-email" placeholder="Email" class="form-input">
                        <input type="text" id="new-client-phone" placeholder="Teléfono" class="form-input">
                    </div>
                    <button class="btn btn-primary" onclick="adminApp.addManualClient()">Guardar</button>
                    <button class="btn btn-outline" onclick="document.getElementById('add-client-form').style.display='none'">Cancelar</button>
                </div>

                <div id="clients-container" class="client-grid"></div>
            </section>

        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>

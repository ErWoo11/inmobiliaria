<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | InmoTravel</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container nav-content">
            <a href="index.html" class="logo"><i class="fas fa-building-user"></i> Admin Panel</a>
            <a href="index.html" class="btn btn-outline" style="border:1px solid #ccc;">Ir a la Web</a>
        </div>
    </header>

    <main class="container admin-panel" id="admin-panel">
        <div class="admin-header">
            <h2>Gestión de Propiedades</h2>
        </div>

        <!-- Formulario de Alta -->
        <div class="form-card">
            <h3><i class="fas fa-plus-circle"></i> Nueva Propiedad</h3>
            <form id="property-form" style="margin-top:20px;">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Título de la Propiedad</label>
                        <input type="text" id="title" required placeholder="Ej: Villa con vistas al mar">
                    </div>
                    
                    <div class="form-group">
                        <label>Precio (€)</label>
                        <input type="number" id="price" required placeholder="150000">
                    </div>
                    <div class="form-group">
                        <label>Periodo (Solo alquiler)</label>
                        <select id="period">
                            <option value="">Venta (Sin periodo)</option>
                            <option value="noche">Por Noche</option>
                            <option value="mes">Por Mes</option>
                            <option value="semana">Por Semana</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Tipo</label>
                        <select id="type" required>
                            <option value="rent">Alquiler Vacacional</option>
                            <option value="sale">Venta</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="category" required>
                            <option value="apartamento">Apartamento</option>
                            <option value="villa">Villa/Chalet</option>
                            <option value="piso">Piso</option>
                            <option value="parcela">Parcela</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Ubicación</label>
                        <input type="text" id="location" required placeholder="Ciudad, Zona">
                    </div>

                    <div class="form-group">
                        <label>Habitaciones</label>
                        <input type="number" id="beds" value="2">
                    </div>
                    <div class="form-group">
                        <label>Baños</label>
                        <input type="number" id="baths" value="1">
                    </div>

                    <div class="form-group full-width">
                        <label>URL Imagen</label>
                        <input type="url" id="img" placeholder="https://..." value="https://picsum.photos/seed/new/400/300">
                        <small style="color:#888;">Usa una URL de imagen válida.</small>
                    </div>

                    <div class="form-group full-width">
                        <label>Descripción</label>
                        <textarea id="desc" rows="3" placeholder="Detalles importantes..."></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Publicar Propiedad</button>
            </form>
        </div>

        <!-- Listado Existente -->
        <h3>Propiedades Activas</h3>
        <div id="admin-list">
            <!-- Se llena con JS -->
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>

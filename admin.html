<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | InmoTravel</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="container nav-content">
            <a href="index.html" class="logo"><i class="fas fa-building-user"></i> Admin Panel</a>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-outline" style="border:1px solid #ccc;" onclick="window.location.href='index.html'">
                    <i class="fas fa-globe"></i> Ver Web
                </button>
            </div>
        </div>
    </header>

    <!-- AQUÍ ESTÁ LA CORRECCIÓN: Se añadió id="admin-panel" -->
    <div class="admin-layout" id="admin-panel">
        
        <!-- SIDEBAR -->
        <aside class="admin-sidebar">
            <nav>
                <a href="#" class="nav-link active" onclick="adminApp.switchView('dashboard', this)">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="#" class="nav-link" onclick="adminApp.switchView('properties', this)">
                    <i class="fas fa-home"></i> Propiedades
                </a>
                <a href="#" class="nav-link" onclick="adminApp.switchView('messages', this)">
                    <i class="fas fa-envelope"></i> Mensajes
                    <span id="msg-badge" style="background:var(--accent); color:white; padding:2px 6px; border-radius:10px; font-size:0.7rem; margin-left:auto; display:none;">0</span>
                </a>
            </nav>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="admin-main">
            
            <!-- VISTA DASHBOARD -->
            <section id="view-dashboard" class="admin-view">
                <h2>Resumen General</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3 id="stat-props">0</h3>
                        <p>Propiedades</p>
                    </div>
                    <div class="stat-card" style="border-color: var(--accent);">
                        <h3 id="stat-msgs">0</h3>
                        <p>Mensajes Nuevos</p>
                    </div>
                    <div class="stat-card" style="border-color: #10b981;">
                        <h3 id="stat-rentals">0</h3>
                        <p>Alquileres</p>
                    </div>
                    <div class="stat-card" style="border-color: #ef4444;">
                        <h3 id="stat-sales">0</h3>
                        <p>Ventas</p>
                    </div>
                </div>
                
                <div class="admin-form">
                    <h3><i class="fas fa-bolt"></i> Accesos Rápidos</h3>
                    <div style="margin-top:15px; display:flex; gap:10px;">
                        <!-- Estos botones ahora funcionarán porque adminApp estará definido -->
                        <button class="btn btn-primary" onclick="adminApp.resetForm(); adminApp.switchView('properties')">Añadir Propiedad</button>
                        <button class="btn btn-outline" onclick="adminApp.switchView('messages')">Ver Bandeja de Entrada</button>
                    </div>
                </div>
            </section>

            <!-- VISTA PROPIEDADES -->
            <section id="view-properties" class="admin-view" style="display:none;">
                <h2>Gestión de Inmuebles</h2>
                
                <!-- Formulario (Crear/Editar) -->
                <div class="admin-form">
                    <h3 id="form-title"><i class="fas fa-plus-circle"></i> Nueva Propiedad</h3>
                    <input type="hidden" id="edit-id"> <!-- ID oculto para edición -->
                    
                    <form id="property-form" style="margin-top:20px;">
                        <div class="form-grid">
                            <div class="form-group full-width">
                                <label>Título</label>
                                <input type="text" id="title" required>
                            </div>
                            <div class="form-group">
                                <label>Precio (€)</label>
                                <input type="number" id="price" required>
                            </div>
                            <div class="form-group">
                                <label>Periodo (Vacacional)</label>
                                <select id="period">
                                    <option value="">Venta (Ninguno)</option>
                                    <option value="noche">Por Noche</option>
                                    <option value="mes">Por Mes</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Tipo</label>
                                <select id="type" required>
                                    <option value="rent">Alquiler</option>
                                    <option value="sale">Venta</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Categoría</label>
                                <select id="category">
                                    <option value="apartamento">Apartamento</option>
                                    <option value="villa">Villa</option>
                                    <option value="piso">Piso</option>
                                    <option value="parcela">Parcela</option>
                                </select>
                            </div>
                            <div class="form-group full-width">
                                <label>Ubicación</label>
                                <input type="text" id="location" required>
                            </div>
                            <div class="form-group">
                                <label>Habitaciones</label>
                                <input type="number" id="beds" value="2">
                            </div>
                            <div class="form-group">
                                <label>Baños</label>
                                <input type="number" id="baths" value="1">
                            </div>
                            <div class="form-group full-width">
                                <label>URL Imagen</label>
                                <input type="url" id="img" value="https://picsum.photos/seed/new/400/300">
                            </div>
                            <div class="form-group full-width">
                                <label>Descripción</label>
                                <textarea id="desc" rows="3"></textarea>
                            </div>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <button type="submit" class="btn btn-primary" id="btn-save">Publicar</button>
                            <button type="button" class="btn btn-outline" id="btn-cancel" style="display:none;" onclick="adminApp.resetForm()">Cancelar Edición</button>
                        </div>
                    </form>
                </div>

                <h3>Listado Activas</h3>
                <div id="admin-list" class="properties-grid">
                    <!-- JS carga aquí -->
                </div>
            </section>

            <!-- VISTA MENSAJES -->
            <section id="view-messages" class="admin-view" style="display:none;">
                <h2>Bandeja de Entrada</h2>
                <div id="messages-container">
                    <p>Cargando mensajes...</p>
                </div>
            </section>

        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
